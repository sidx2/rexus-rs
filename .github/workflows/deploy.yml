name: Deploy Rust Backend to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # 1. Create the private key file securely on the runner
      - name: Setup SSH Key
        run: |
          echo "${{ secrets.AWS_SSH_KEY_RAW }}" > private_key.pem
          chmod 600 private_key.pem

      # 2. Prepare remote directory & clean backup via native SSH
      - name: Prepare Remote Environment
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@3.27.4.171 "mkdir -p ~/rexus && cd ~/rexus && rm -f hotel-order-backend.backup"

      # 3. Copy binary via native SCP
      - name: Copy binary via SCP
        run: |
          scp -o StrictHostKeyChecking=no -i private_key.pem target/release/hotel-order-backend ubuntu@3.27.4.171:~/rexus/

      # 4. Restart application safely via native SSH
      - name: Restart application on AWS
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@3.27.4.171 << 'EOF'
            cd ~/rexus
            
            if [ -f hotel-order-backend ]; then
              mv hotel-order-backend hotel-order-backend.backup
            fi
            
            chmod +x hotel-order-backend
            
            tmux send-keys -t backend C-c || true
            sleep 1
            
            if ! tmux has-session -t backend 2>/dev/null; then
              tmux new-session -d -s backend "./hotel-order-backend > output.log 2>&1"
            else
              tmux send-keys -t backend "./hotel-order-backend > output.log 2>&1" C-m
            fi
            
            echo "Deployment completed successfully!"
          EOF