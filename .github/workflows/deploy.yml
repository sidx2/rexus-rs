name: Deploy Rust Backend to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # 1. Prepare Remote Environment
      - name: Prepare Remote Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.27.4.171
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY_RAW }}
          port: 22
          script: |
            mkdir -p ~/rexus
            cd ~/rexus
            rm -f hotel-order-backend.backup

      # 2. Copy binary via SCP
      - name: Copy binary via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 3.27.4.171
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY_RAW }}
          source: "target/release/hotel-order-backend"
          target: "~/rexus/"
          strip_components: 2

      # 3. Restart application safely
      - name: Restart application on AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.27.4.171
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY_RAW }}
          port: 22
          script: |
            cd ~/rexus
            
            if [ -f hotel-order-backend ]; then
              mv hotel-order-backend hotel-order-backend.backup
            fi
            
            chmod +x hotel-order-backend
            
            tmux send-keys -t backend C-c || true
            sleep 1
            
            if ! tmux has-session -t backend 2>/dev/null; then
              tmux new-session -d -s backend "./hotel-order-backend > output.log 2>&1"
            else
              tmux send-keys -t backend "./hotel-order-backend > output.log 2>&1" C-m
            fi
            
            echo "Deployment completed successfully!"